# sites.yaml — per-site paths and settings for the metagenome-to-model workflow.
# Select a site with --site <name> (or MAG_SITE_PROFILE). Each site defines:
#   runtime, queues, gpu_arg, exec_site  (scheduler/container)
#   reads_dir, kofam_db, func_db         (data + database paths)
#   ssh (host/user/key)                  (for transfers, optional)

nersc:
  runtime:    shifter
  cpu_queue:  regular
  gpu_queue:  regular
  gpu_arg:    "-C gpu"
  cpu_arg:    "-C cpu"
  exec_site:  compute
  reads_dir:  /home/hsafri/hotSprings/PegasusWMS-SubductCR_16S-diversity/subductcr-final/data/metagenome
  kofam_db:   /global/cfs/cdirs/m4144/hsafri/refs/kofam_db
  func_db:    /global/cfs/cdirs/m4144/hsafri/refs/mmseqs/uniref50
  reference:  /home/hsafri/hotSprings/PegasusWMS-SubductCR_16S-diversity/subductcr-final/data/reference

usc:
  runtime:    singularity
  cpu_queue:  main
  gpu_queue:  gpu
  gpu_arg:    "--gres=gpu:a100:1"
  cpu_arg:    ""
  exec_site:  usc
  reads_dir:  /project/vahi_1862/hotspring/data/metagenome
  kofam_db:   /project/vahi_1862/hotspring/db/kofam_db
  func_db:    /project/vahi_1862/hotspring/db/mmseqs/uniref50
  reference:  /project/vahi_1862/hotspring/data/reference
  ssh_host:   laguna.carc.usc.edu
  ssh_user:   "hs_295@usc.edu"
  ssh_key:    /home/hsafri/ssh_laguna/laguna

slurm:
  runtime:    singularity
  cpu_queue:  compute
  gpu_queue:  gpu
  gpu_arg:    "--gres=gpu:1"
  cpu_arg:    ""
  exec_site:  condorpool
  reads_dir:  ./data/metagenome
  kofam_db:   ./db/kofam_db
  func_db:    ./db/mmseqs/uniref50
  reference:  ./data/reference
